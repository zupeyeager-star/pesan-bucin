<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Aruna</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #ffe6e8;
      padding: 30px 15px;
      color: #333;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 350px;
      margin: 0 auto;
    }
    button {
      background-color: #ff4d6d;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    #pesan {
      font-size: 18px;
      margin-top: 20px;
      font-weight: 500;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Ada pesan buat kamu, Aruna 💌</h2>
    <button onclick="munculkanPesan()">Pencet di sini!</button>
    <p id="pesan"></p>
  </div>

  <script>
    window.Telegram.WebApp.ready();

    function munculkanPesan() {
      document.getElementById('pesan').innerText = 'Kamu lucu banget';
    }
  </script>

</body>
</html>
